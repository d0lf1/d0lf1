name: Segnalazione
description: Segnala un refuso, un link non valido o un problema nel profilo
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie. Per questioni di sicurezza non usare questo modulo: vedi
        `SECURITY.md`.
  - type: textarea
    id: what
    attributes:
      label: Descrizione
      description: Cosa hai notato e, se utile, dove.
    validations:
      required: true
