name: Generate Snake

# Genera l'SVG dell'animazione "snake" sul contribution graph e lo pubblica
# sul branch `output`, servito da GitHub stesso (nessun embed runtime di terzi).
# Action di terze parti pinnate al commit SHA (hardening supply-chain).

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c8f53c&color_dots=#0a0b0f,#1e2a0f,#50660f,#9ccb1f,#c8f53c

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
